# Door room v2 (v1 + clutter + look-alikes): 3 scenes x 8 views = 24 frames (quick check).
world: door_room_v2
seed: 0
scenes: 3
views_per_scene: 8
settle_steps: 6000          # max physics steps (1 ms) to let the doors reach their new position

doors:                      # per scene
  p_closed: 0.3             # chance a door is closed
  min_open_fraction: 0.1    # otherwise opened 10..100 % of its range

lights:                     # per scene: base colour (from the world file) x intensity, plus a small tint
  ceiling_light: {type: point, base: [0.8, 0.8, 0.75], intensity: [0.3, 1.2], tint: 0.1,
                  range: 8, attenuation: [0.5, 0.1, 0.02], cast_shadows: false}
  sun: {type: directional, base: [0.9, 0.9, 0.9], intensity: [0.3, 1.0], tint: 0.05,
        direction: [-0.3, 0.2, -0.9], cast_shadows: true}

clutter:                    # per scene, sim/doorsim/clutter.py (pool of visual-only models, moved in or parked)
  floor_count: [0, 8]       # floor items in the scene (shapes + furniture + look-alikes)
  wall_count: [0, 3]        # picture frames etc. on the wall beside the doors
  zone: {x: [-0.5, 2.94], y: [-2.9, 2.9]}   # floor area on the camera side; 2.94 = wall face
  keep_out:                 # floor rectangles kept clear
    - {x: [2.75, 2.94], y: [0.40, 2.10]}    # sliding door B's panel + where it slides to
    - {x: [2.75, 2.94], y: [-1.60, -0.40]}  # door A's handle side of the frame
  gap: 0.05                 # min space between floor items, m
  p_against_wall: 0.3       # chance a floor item stands with its back to the wall, facing the camera
  wall: {x: 2.94, y: [-2.9, 2.9], z: [0.9, 2.0], keep_out_y: [[-1.6, -0.4], [0.4, 2.1]]}
  camera_margin: 0.15       # a viewpoint this close to (or inside) an item is tried again

view:                       # per frame: camera in front of a random door
  distance: [0.5, 4.0]      # m from the door centre (on the wall face)
  angle_deg: 60             # max angle off straight in front
  height: [0.3, 1.5]        # camera height, m (small to tall robots)
  target_height: [0.6, 1.6] # aim point on the door, m
  target_jitter: 0.3        # aim point shift along the wall, m
  roll_deg: 0

reject:                     # a viewpoint is tried again when
  min_depth: 0.2            # something is closer than this (camera inside / against a door)
  need_target_box: true     # the door it aims at isn't in the image
  max_tries: 20

glass_depth:                # per frame with glass in view
  mix: {holes: 0.4, see_through: 0.3, partial: 0.3}
  partial: {holes: 0.35, see_through: 0.35, cell: 32}   # rest of the glass keeps its surface depth
