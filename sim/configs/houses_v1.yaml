# Dutch houses v1 (Madelief 2026-11-14: "Extend our generator"; target = DoD section 1, an average Dutch terraced house).
# Layout numbers = Claude decisions (research-based, dev log 2026-11-14): terraced / doorzon house 5.4-6.5 m wide, 7-9 m deep
# (huurwoningen.nl / bestaandewoningbouw.nl doorzonwoning, makelaar beukmaat 5.4 / 5.7 m), inner doors ~0.83 x 2.015 m (Bbl),
# toilet >= 0.85 x 1.2 m, stairs >= 0.8 m wide. One world per floor (DoD choice A2: floors apart until a legged robot climbs stairs).
#   python3 sim/building/make_buildings.py sim/configs/houses_v1.yaml      -> hse_<split>_<seed>_f0 (ground) + _f1 (upper)
seed: 0
count: 3
split: train
kind: house
house:
  width: [5.4, 6.5]             # m, outer wall centre to centre (beukmaat)
  depth: [7.5, 9.0]             # m, front to back
  strip_width: [1.8, 2.3]       # m, hall / landing strip along one side wall (which side: random)
  stairs: {width: [0.8, 0.9], length: [2.6, 3.0], front_gap: [0.3, 1.0]}   # straight run against the side wall, from front_gap behind the facade, rising to the back
  ground: {hall_free: 1.0, toilet_depth: [1.2, 1.4], kitchen_min: 2.2, p_ensuite: 0.3, ensuite_front: [0.4, 0.6]}
  upper: {step_off: 0.9, bed3_depth: [2.0, 2.6], bath_depth: [1.8, 2.4], bed1_front: [0.4, 0.6]}
  min_shared: 1.4               # m, shortest shared wall a planned door needs
  rail_height: 1.0              # m, railing box around the stair void upstairs (an obstacle for the wheeled robot)
p_second_door: 0.0
p_neighbour_door: 0.0
corner_margin: 0.3
p_closed: 0.4
min_open: 0.3
door_stop: true
heldout:
  - {glass: true, handle_type: knob}
  - {door_type: sliding, glass: true}
approach:
  distances: [2.5, 1.0]
robot_radius: 0.3
min_door_gap: 0.6
clutter:
  rooms: {floor_count: [1, 3], wall_count: [0, 2]}
  corridor: {floor_count: [0, 1], wall_count: [0, 2]}
  gap: 0.05
  p_against_wall: 0.8
  wall_z: [0.9, 2.0]
  door_margin: 0.2
map_resolution: 0.05

door:                       # per door (the v5 sampler; every door is built in slot a, then moved into the building)
  p_sliding: 0.1                       # houses: hinged mostly; the en-suite door is always sliding
  p_glass: 0.35
  handle: {lever: 0.5, knob: 0.5}      # hinged doors; sliding doors get a flush pull
  width: [0.78, 0.93]                  # m, Dutch inner doors (0.83 most common; older houses 0.78)
  height: [2.0, 2.1]                   # m, house inner doors (2.015 standard)
  frame_style: {none: 0.33, thin: 0.34, thick: 0.33}
  p_hangs_back: 0.5                    # sliding doors: hung on the back face instead of the front
  colours:                             # door colour family, then a random shade inside it
    wood: {p: 0.4, rgb: [[0.45, 0.28, 0.14], [0.85, 0.7, 0.5]]}
    white: {p: 0.25, rgb: [[0.85, 0.85, 0.82], [0.97, 0.97, 0.95]]}
    grey: {p: 0.15, rgb: [[0.25, 0.25, 0.27], [0.6, 0.6, 0.62]]}
    painted: {p: 0.2, rgb: [[0.05, 0.05, 0.05], [0.9, 0.9, 0.9]]}
  glass_frame:                         # stiles / rails of glass doors
    aluminium: {p: 0.4, rgb: [[0.55, 0.57, 0.6], [0.7, 0.72, 0.75]]}
    black: {p: 0.25, rgb: [[0.05, 0.05, 0.05], [0.15, 0.15, 0.15]]}
    white: {p: 0.15, rgb: [[0.85, 0.85, 0.85], [0.95, 0.95, 0.95]]}
    wood: {p: 0.2, rgb: [[0.45, 0.28, 0.14], [0.85, 0.7, 0.5]]}
  trim:                                # door frame trim colour (frame_style thin / thick)
    white: {p: 0.5, rgb: [[0.9, 0.9, 0.88], [0.97, 0.97, 0.95]]}
    match: {p: 0.3}                    # same as the door
    dark: {p: 0.2, rgb: [[0.1, 0.1, 0.1], [0.35, 0.3, 0.25]]}
