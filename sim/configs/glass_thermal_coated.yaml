# Stress test: low-E coated glass (emissivity 0.1-0.3): mostly a mirror of the surroundings.
emissivity: [0.10, 0.30]   # 8-14 um, at normal incidence
leak: [0.0, 0.02]         # share of the radiance from behind the pane
env_K: [-3.0, 3.0]    # reflected surroundings: air + offset (K)
env_noise_K: 1.0      # + smooth noise (K)
env_cell: 16          # px
robot: {p: 1.0, radius_m: 0.25, dK: [5.0, 15.0]}   # the robot's own warm mirror image
