# Buildings v1, Madelief 2026-11-07, robot run phase 2e: python3 sim/building/make_buildings.py sim/configs/buildings_v1.yaml
# One floor: a corridor with rooms on both sides (sim/doorsim/building.py). Doors come from the v5 sampler (same door section as
# worlds_v4 / worlds_v5, door stop + hinge knuckles on). Building i uses seed seed + i and is named bld_<split>_<seed>.
seed: 0
count: 3
split: train                # train / val: no held-out combos; test: held-out combos allowed
corridor_length: [12.0, 16.0]   # m
corridor_width: [1.8, 2.4]
room_width: [2.6, 4.5]          # rooms are cut along the corridor at random widths in this range
room_depth: [3.0, 4.5]          # one random depth per side of the corridor
p_second_door: 0.25             # a room gets a second door to the corridor
p_neighbour_door: 0.3           # a room gets a door to its east neighbour
corner_margin: 0.3              # m between a door (opening + trim + slide path) and the ends of its wall
p_closed: 0.4                   # door state: closed, else open by a random fraction in [min_open, 1]
min_open: 0.3
door_stop: true
heldout:                    # property combos never seen in training (each value on its own is)
  - {glass: true, handle_type: knob}
  - {door_type: sliding, glass: true}
approach:
  distances: [2.5, 1.0]         # m from the door centre, on both sides (clamped to stay inside the space)
robot_radius: 0.3
clutter:                        # optional: furniture / look-alikes from doorsim/clutter.py POOL (one item at most once per space)
  rooms: {floor_count: [1, 4], wall_count: [0, 2]}       # random count per room, floor items and wall items (frames, whiteboard)
  corridor: {floor_count: [0, 2], wall_count: [0, 3]}
  gap: 0.05                     # m between floor items of one space
  p_against_wall: 0.6           # chance a floor item stands with its back to a wall of its space (else random yaw)
  wall_z: [0.9, 2.0]            # m, height range of wall items
  door_margin: 0.2              # m wall items stay off a door's opening + trim (+ slide path) along the wall
map_resolution: 0.05            # m per pixel of the Nav2 map

door: test only
split_ratios: [0.7, 0.15, 0.15]
heldout:                    # property combos never seen in training (each value on its own is): CLEVR-CoGenT style
  - {glass: true, handle_type: knob}
  - {door_type: sliding, glass: true}

door:                       # per door (the v5 sampler; every door is built in slot a, then moved into the building)
  p_sliding: 0.35
  p_glass: 0.35
  handle: {lever: 0.5, knob: 0.5}      # hinged doors; sliding doors get a flush pull
  width: [0.8, 1.0]                    # m, uniform (common doors 0.83 / 0.93)
  height: [2.0, 2.3]                   # m, uniform (NL standard 2.015 / 2.315)
  frame_style: {none: 0.33, thin: 0.34, thick: 0.33}
  p_hangs_back: 0.5                    # sliding doors: hung on the back face instead of the front
  colours:                             # door colour family, then a random shade inside it
    wood: {p: 0.4, rgb: [[0.45, 0.28, 0.14], [0.85, 0.7, 0.5]]}
    white: {p: 0.25, rgb: [[0.85, 0.85, 0.82], [0.97, 0.97, 0.95]]}
    grey: {p: 0.15, rgb: [[0.25, 0.25, 0.27], [0.6, 0.6, 0.62]]}
    painted: {p: 0.2, rgb: [[0.05, 0.05, 0.05], [0.9, 0.9, 0.9]]}
  glass_frame:                         # stiles / rails of glass doors
    aluminium: {p: 0.4, rgb: [[0.55, 0.57, 0.6], [0.7, 0.72, 0.75]]}
    black: {p: 0.25, rgb: [[0.05, 0.05, 0.05], [0.15, 0.15, 0.15]]}
    white: {p: 0.15, rgb: [[0.85, 0.85, 0.85], [0.95, 0.95, 0.95]]}
    wood: {p: 0.2, rgb: [[0.45, 0.28, 0.14], [0.85, 0.7, 0.5]]}
  trim:                                # door frame trim colour (frame_style thin / thick)
    white: {p: 0.5, rgb: [[0.9, 0.9, 0.88], [0.97, 0.97, 0.95]]}
    match: {p: 0.3}                    # same as the door
    dark: {p: 0.2, rgb: [[0.1, 0.1, 0.1], [0.35, 0.3, 0.25]]}
